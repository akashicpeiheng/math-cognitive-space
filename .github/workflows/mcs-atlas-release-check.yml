name: MCS atlas release candidate
on:
  push:
    branches: [codex/mcs-atlas-ci-20261114]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcs-web
    env:
      MCS_WEB_REQUIRE_BROWSER: '1'
      MCS_WEB_REQUIRE_TLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcs-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node tests/browser.mjs
